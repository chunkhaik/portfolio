server {
	listen 80;

	root /usr/share/nginx/html;
	index index.html;

	location = /resume {
		try_files /ChunKhai_Resume_Sep24.pdf =404;
	}

	location = /instagram {
		return 307 https://www.instagram.com/chunkhaik;
	}

	# Next static export: extensionless routes are .html files
	location / {
		try_files $uri $uri.html $uri/ =404;
	}

	location /_next/static/ {
		expires 1y;
	}
}
